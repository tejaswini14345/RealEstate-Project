name: Python Syntax CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m compileall accounts contacts listings pages realestate realtors manage.py
